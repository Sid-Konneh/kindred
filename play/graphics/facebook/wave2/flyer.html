<!doctype html>
<html><head><meta charset="utf-8">
<!-- Kindred SL Facebook flyers, wave 2. Open flyer.html#<n> (1-10) at 1080x1350 and screenshot.
     Phones show real app screenshots (fictional demo members with initial art, never real people's photos). -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
  :root { --grad: linear-gradient(135deg, #F2436B 0%, #FF8A3D 100%); --brand: #EC3B63; --text: #1D1A1F; --muted: #6F6A73; --bg: #FBF8F6; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1080px; height: 1350px; background: var(--bg); font-family: "Plus Jakarta Sans", "Noto Color Emoji", sans-serif; color: var(--text); overflow: hidden; position: relative; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .38; background: var(--grad); }
  .b1 { width: 700px; height: 700px; right: -240px; top: 260px; } .b2 { width: 420px; height: 420px; left: -180px; top: -120px; opacity: .2; }
  header { position: absolute; top: 64px; left: 80px; } header svg { height: 64px; }
  .tag { position: absolute; top: 76px; right: 80px; background: #fff; border-radius: 999px; padding: 12px 24px; font-weight: 800; font-size: 22px; color: var(--brand); box-shadow: 0 6px 18px rgba(236,59,99,.14); }
  h1 { font-family: Fraunces, serif; font-weight: 600; font-size: 84px; line-height: 1.02; letter-spacing: -2px; }
  h1 em { font-style: italic; font-weight: 700; background: var(--grad); -webkit-background-clip: text; color: transparent; }
  .sub { font-size: 29px; line-height: 1.4; color: var(--muted); font-weight: 500; }
  .phone { position: absolute; border-radius: 52px; overflow: hidden; background-repeat: no-repeat;
           box-shadow: 0 40px 80px rgba(236,59,99,.28), 0 10px 30px rgba(0,0,0,.18); }
  footer { position: absolute; left: 80px; right: 80px; bottom: 64px; display: flex; justify-content: space-between; align-items: center; }
  .cta { background: var(--grad); color: #fff; font-weight: 800; font-size: 31px; padding: 24px 42px; border-radius: 999px; box-shadow: 0 14px 30px rgba(236,59,99,.35); display: flex; align-items: center; gap: 12px; }
  .made { font-size: 24px; font-weight: 800; color: var(--brand); display: flex; align-items: center; gap: 10px; }

  /* split: text and numbered list on the left, tilted phone on the right */
  .split .left { position: absolute; left: 80px; top: 190px; width: 460px; display: flex; flex-direction: column; gap: 26px; }
  .items { display: flex; flex-direction: column; gap: 30px; margin-top: 10px; }
  .it { display: flex; gap: 18px; align-items: flex-start; }
  .n { width: 46px; height: 46px; border-radius: 14px; background: var(--grad); color: #fff; font-family: Fraunces, serif; font-size: 26px; font-weight: 600; display: grid; place-items: center; flex: none; }
  .it b { display: block; font-size: 25px; font-weight: 800; line-height: 1.25; padding-top: 6px; }
  .it span { display: block; font-size: 21px; color: var(--muted); font-weight: 500; line-height: 1.35; margin-top: 3px; }
  .split .phone { right: 50px; top: 215px; width: 480px; height: 833px; transform: rotate(3deg); }

  /* hero: brand gradient, big centred headline, phone rising from the bottom */
  .hero { background: var(--grad); color: #fff; }
  .hero .blob { background: #fff; opacity: .22; }
  .hero .tag { color: var(--brand); }
  .hero .top { position: absolute; top: 180px; left: 80px; right: 80px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .hero h1 { font-size: 96px; color: #fff; }
  .hero h1 em { background: none; color: #FFE7D6; -webkit-background-clip: initial; }
  .hero .sub { color: rgba(255,255,255,.92); max-width: 820px; }
  .hero .cta { background: #fff; color: var(--brand); box-shadow: 0 14px 30px rgba(120,20,40,.25); font-size: 29px; padding: 20px 38px; margin-top: 8px; }
  .hero .phone { left: 50%; margin-left: -290px; top: 610px; border-radius: 56px; box-shadow: 0 0 0 14px #141116, 0 40px 90px rgba(90,10,30,.45); }
  .hero .url { font-weight: 800; font-size: 23px; color: #fff; opacity: .95; margin-top: -4px; }

  /* duo: headline on top, two phones side by side */
  .duo .top { position: absolute; top: 180px; left: 80px; right: 80px; display: flex; flex-direction: column; gap: 18px; }
  .duo .phone { top: 450px; width: 400px; height: 694px; }
  .duo .p1 { left: 110px; transform: rotate(-5deg); } .duo .p2 { right: 110px; transform: rotate(5deg); top: 480px; }
  .steps { display: flex; gap: 14px; margin-top: 6px; }
  .steps span { background: #fff; border-radius: 999px; padding: 10px 20px; font-weight: 800; font-size: 21px; color: var(--brand); box-shadow: 0 6px 18px rgba(236,59,99,.12); }

  /* cards: headline and a 2x2 grid of tips, no phone */
  .cards .top { position: absolute; top: 190px; left: 80px; right: 80px; display: flex; flex-direction: column; gap: 22px; }
  .grid { position: absolute; left: 80px; right: 80px; top: 470px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .card { background: #fff; border-radius: 30px; padding: 34px 32px; box-shadow: 0 16px 40px -18px rgba(40,20,30,.25); display: flex; flex-direction: column; gap: 12px; min-height: 290px; }
  .card .em { font-size: 52px; line-height: 1; }
  .card b { font-size: 29px; font-weight: 800; line-height: 1.2; }
  .card span { font-size: 22px; color: var(--muted); line-height: 1.4; font-weight: 500; }

  /* overlays drawn on top of a phone screenshot */
  .ov { position: absolute; left: 0; right: 0; }
  .banner { color: var(--text); top: 3.2%; margin: 0 4%; background: #fff; border-radius: 26px; padding: 4.2% 4.5%; display: flex; gap: 4%; align-items: center; box-shadow: 0 18px 40px rgba(0,0,0,.28); border: 1px solid #ECE6E2; }
  .banner svg { width: 13%; flex: none; }
  .banner b { display: block; font-size: 1.12em; font-weight: 800; } .banner small { display: block; font-size: .9em; color: var(--muted); margin-top: 3px; }
  .callscr { inset: 0; background: linear-gradient(170deg, #2A1B2E, #120E14 70%); color: #fff; display: flex; flex-direction: column; align-items: center; padding-top: 22%; text-align: center; }
  .callscr .av { width: 44%; aspect-ratio: 1; border-radius: 50%; background: linear-gradient(135deg, #11B39A, #1E88E5); display: grid; place-items: center; font-family: Fraunces, serif; font-size: 7.5em; font-weight: 600; box-shadow: 0 0 0 18px rgba(255,255,255,.06), 0 0 0 40px rgba(255,255,255,.035); }
  .callscr h3 { font-size: 2.2em; font-weight: 800; margin-top: 16%; } .callscr p { font-size: 1.15em; opacity: .75; margin-top: 2%; }
  .callscr .btns { position: absolute; bottom: 12%; left: 0; right: 0; display: flex; justify-content: space-around; padding: 0 12%; }
  .callscr .btns i { width: 23%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; }
  .callscr .btns svg { width: 45%; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .photo { top: 42%; right: 5%; left: auto; width: 52%; aspect-ratio: 4/5; border-radius: 26px; overflow: hidden; background: linear-gradient(150deg, #FFB36B, #F2436B 55%, #7B3FE4); box-shadow: 0 16px 40px rgba(0,0,0,.25); }
  .photo::before { content: ""; position: absolute; inset: -20px; background: radial-gradient(circle at 35% 30%, #FFE3A3 0 14%, transparent 15%), radial-gradient(circle at 70% 75%, rgba(255,255,255,.5) 0 22%, transparent 23%); filter: blur(22px); }
  .photo div { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: rgba(20,14,20,.55); color: #fff; padding: 12px 22px; border-radius: 999px; font-weight: 800; font-size: 1.05em; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
</style></head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<header id="logo"></header>
<div class="tag" id="tag"></div>
<main id="main"></main>
<script>
const LOGO = c => `<svg viewBox="0 0 460 120"><defs><linearGradient id="k" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2436B"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient></defs><g transform="translate(4 6) scale(1.1)" fill="none" stroke="${c ? "#fff" : "url(#k)"}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M43 27.5C36 20.5 24.5 21.5 18 32c-8 14 2 32 32 52"/><path d="M57 27.5C64 20.5 75.5 21.5 82 32c8 14-2 32-32 52" stroke-opacity=".82"/></g><circle cx="59" cy="23.6" r="5" fill="${c ? "#fff" : "#F2436B"}"/><text x="124" y="84" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="72" letter-spacing="-1.5" fill="${c ? "#fff" : "#1D1A1F"}">kindred</text></svg>`;
const MARK = `<svg viewBox="0 0 100 100" fill="none" stroke="url(#k)" stroke-width="9" stroke-linecap="round"><path d="M43 27.5C36 20.5 24.5 21.5 18 32c-8 14 2 32 32 52"/><path d="M57 27.5C64 20.5 75.5 21.5 82 32c8 14-2 32-32 52" stroke-opacity=".82"/><circle cx="50" cy="16" r="5" fill="#F2436B" stroke="none"/></svg>`;
const FLAG = `<svg width="42" height="28" viewBox="0 0 3 2" style="border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.08)"><rect width="3" height="2" fill="#0072C6"/><rect width="3" height="1.333" fill="#fff"/><rect width="3" height=".667" fill="#1EB53A"/></svg>`;
const ARROW = `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
const shot = n => `../../screenshots/${n}.png`;
// The phone screen sits at x 160-920, y 452-1803 in every 1080x1920 store screenshot.
function phone(cls, name, w, h, overlay = "", extra = "") {
  const s = w / 760, fs = Math.round(w / 21);
  return `<div class="phone ${cls}" style="width:${w}px;height:${h}px;background-image:url('${shot(name)}');background-size:${1080 * s}px ${1920 * s}px;background-position:${-160 * s}px ${-452 * s}px;font-size:${fs}px;${extra}">${overlay}</div>`;
}
const banner = (t, b) => `<div class="ov banner">${MARK}<span><b>${t}</b><small>${b}</small></span></div>`;
const callScreen = `<div class="ov callscr"><div class="av">A</div><h3>Aminata</h3><p>Kindred video call…</p>
  <div class="btns"><i style="background:#E5484D"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></i><i style="background:#16A37B"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></i></div></div>`;
const blurred = `<div class="ov photo"><div>👁 Tap to view</div></div>`;

const F = [
  null,
  { layout: "hero", tag: "New", h1: "Never miss a <em>match.</em>", sub: "Kindred now alerts you to new likes, matches, messages and calls.", cta: "Update Kindred today",
    phone: ["05-05-matches", banner("It's a match! 💞", "You and Aminata liked each other. Say hello!")] },
  { layout: "split", tag: "Calls", h1: "Hear their <em>voice.</em>", sub: "Voice and video calls with your matches, right inside Kindred.", cta: "Call your match",
    items: [["Voice calls", "Tap the phone icon in any chat"], ["Video calls", "See who you're talking to before you meet"], ["Your number stays private", "No need to share your phone number"], ["Matches only", "Only people you've matched with can call you"]],
    phone: ["03-06-chat", callScreen] },
  { layout: "hero", tag: "Chat", h1: "Share the <em>moment.</em>", sub: "Send photos and videos to your matches. What they send stays blurred until you tap.", cta: "Say hello now",
    phone: ["03-06-chat", blurred] },
  { layout: "duo", tag: "How it works", h1: "Like. Match. <em>Chat.</em>", sub: "When you both like each other, it's a match, and the chat opens.", cta: "Start swiping",
    phones: ["01-02-discover", "02-04-match"], steps: ["1 · Like", "2 · Match", "3 · Say hello 👋"] },
  { layout: "split", tag: "Get the app", h1: "Kindred on <em>any phone.</em>", sub: "Free to join. Same people, same chats, everywhere.", cta: "Download free",
    items: [["Android", "Download the app from kindred-sl.netlify.app"], ["iPhone", "Open the site in Safari → Share → Add to Home Screen"], ["One account, every phone", "Sign in and pick up where you left off"], ["18+ only", "Kindred is for adults"]],
    phone: ["08-01-welcome"] },
  { layout: "cards", tag: "Stay safe", h1: "Love never asks for <em>money.</em>", sub: "Real people on Kindred want to meet you, not your wallet.", cta: "Date safely on Kindred",
    cards: [["💸", "Never send money", "No Orange Money, Afrimoney or airtime to someone you haven't met"], ["💬", "Keep chats on Kindred", "Until you really trust someone"], ["🚩", "Spot the red flags", "Rushing to WhatsApp, sad stories, asking for help with bills"], ["🛡️", "Report and block", "One tap on their profile. They won't know it was you"]] },
  { layout: "split", tag: "Profiles", h1: "See what <em>matters.</em>", sub: "Every profile shows what they're looking for, before you say hi.", cta: "Find your person",
    items: [["What they want", "New friends, a relationship or marriage"], ["Faith", "Muslim, Christian or other"], ["Languages", "Krio, Temne, Mende, Limba, Fula and more"], ["Where they live", "From Freetown to Kenema, Bo and Makeni"]],
    phone: ["04-03-profile"] },
  { layout: "split", tag: "Your rules", h1: "You choose who you <em>see.</em>", sub: "Set up Discover your way, and change it any time.", cta: "Set up your profile",
    items: [["Who you'd like to meet", "Women, men or everyone"], ["Age range", "Pick the ages that suit you"], ["City", "Freetown, Bo, Kenema, Makeni and more"], ["Safety tools", "Tips and guidelines always one tap away"]],
    phone: ["07-07-profile"] },
  { layout: "cards", tag: "Community", h1: "Real people. <em>Real respect.</em>", sub: "Kindred works because members look out for each other.", cta: "Join the community",
    cards: [["🙋🏾", "Be real", "Your own name, age and recent photos"], ["🔞", "18+ only", "Report anyone who looks under 18"], ["🤝🏾", "Be respectful", "No harassment, hate or pressure. No means no"], ["🚫", "No scams or selling", "No asking for money, no promoting businesses"]] },
  { layout: "hero", tag: "Made for Salone 🇸🇱", h1: "Your kindred spirit is <em>out there.</em>", sub: "From Freetown to Kenema, meet genuine people who share your values.", cta: "Join free today",
    phone: ["01-02-discover"] },
];

const P = F[+location.hash.slice(1) || 1];
document.body.classList.add(P.layout);
logo.innerHTML = LOGO(P.layout === "hero");
tag.textContent = P.tag;
const foot = `<footer><span class="cta">${P.cta} ${ARROW}</span><span class="made">kindred-sl.netlify.app ${FLAG}</span></footer>`;
if (P.layout === "split") {
  main.innerHTML = `<div class="left"><h1>${P.h1}</h1><p class="sub">${P.sub}</p><div class="items">${P.items.map(([b, s], i) => `<div class="it"><div class="n">${i + 1}</div><div><b>${b}</b><span>${s}</span></div></div>`).join("")}</div></div>
    ${phone("", P.phone[0], 480, 853, P.phone[1] || "")}${foot}`;
} else if (P.layout === "hero") {
  main.innerHTML = `<div class="top"><h1>${P.h1}</h1><p class="sub">${P.sub}</p><span class="cta">${P.cta} ${ARROW}</span><span class="url">kindred-sl.netlify.app 🇸🇱</span></div>
    ${phone("", P.phone[0], 580, 1030, P.phone[1] || "")}`;
} else if (P.layout === "duo") {
  main.innerHTML = `<div class="top"><h1>${P.h1}</h1><p class="sub">${P.sub}</p><div class="steps">${P.steps.map(s => `<span>${s}</span>`).join("")}</div></div>
    ${phone("p1", P.phones[0], 400, 711)}${phone("p2", P.phones[1], 400, 711)}${foot}`;
} else {
  main.innerHTML = `<div class="top"><h1>${P.h1}</h1><p class="sub">${P.sub}</p></div>
    <div class="grid">${P.cards.map(([e, b, s]) => `<div class="card"><div class="em">${e}</div><b>${b}</b><span>${s}</span></div>`).join("")}</div>${foot}`;
}
// hero: the phone rises from just under the headline block, whatever its height
if (P.layout === "hero") document.fonts.ready.then(() => { document.querySelector(".phone").style.top = document.querySelector(".top").getBoundingClientRect().bottom + 64 + "px"; });
</script>
</body></html>
